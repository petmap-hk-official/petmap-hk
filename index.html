<!DOCTYPE html>
<html lang="zh-HK">
<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PetMap HK - 香港寵物友善地圖</title>
  
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="manifest" href="manifest.json">

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- 引入帶有 places 庫的 Google Maps API -->

  <style>
    :root { --primary-color: #FF7A00; --bg-light: #F8F9FA; --border-color: #E9ECEF; --text-dark: #212529; }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
    body { display: flex; height: 100vh; color: var(--text-dark); overflow: hidden; position: relative; }
    
    #sidebar { 
      width: 380px; 
      height: 100vh; 
      background: white; 
      border-right: 1px solid var(--border-color); 
      display: flex; 
      flex-direction: column; 
      z-index: 1000; 
      box-shadow: 2px 0 10px rgba(0,0,0,0.05); 
      position: absolute;
      top: 0;
      left: 0;
      transition: transform 0.3s ease-in-out;
      transform: translateX(0); 
    }

    #sidebar.collapsed { transform: translateX(-380px); }

    #toggleSidebarBtn {
      position: fixed;
      left: 380px;
      top: 50%;
      transform: translateY(-50%);
      width: 28px;
      height: 60px;
      background-color: #e2e8f0;
      border: 1px solid #cbd5e0;
      border-left: none;
      border-radius: 0 8px 8px 0;
      color: #4a5568;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 2px 0 5px rgba(0,0,0,0.08);
      z-index: 1001;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: left 0.3s ease-in-out, background-color 0.2s;
    }
    #toggleSidebarBtn:hover { background-color: #cbd5e0; }
    #sidebar.collapsed ~ #toggleSidebarBtn { left: 0; }

    .header { padding: 16px; background: var(--primary-color); color: white; display: flex; justify-content: space-between; align-items: center; }
    .header h1 { font-size: 1.1rem; }
    .btn-add { background: white; color: var(--primary-color); border: none; padding: 6px 12px; border-radius: 20px; font-weight: bold; cursor: pointer; }
    .controls { padding: 16px; border-bottom: 1px solid var(--border-color); display: flex; flex-direction: column; gap: 10px; }
    .search-input { width: 100%; padding: 10px 14px; border: 1px solid #CED4DA; border-radius: 8px; outline: none; }
    .filter-tags { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    .btn-filter { padding: 6px 12px; border: 1px solid var(--border-color); border-radius: 20px; background: var(--bg-light); cursor: pointer; font-size: 0.85rem; }
    .btn-filter.active { background: var(--primary-color); color: white; border-color: var(--primary-color); }
    .region-select { padding: 6px 10px; border: 1px solid #CED4DA; border-radius: 20px; background: white; font-size: 0.85rem; outline: none; cursor: pointer; }
    .place-list { flex: 1; overflow-y: auto; padding: 12px; min-height: 0; }
    .place-card { padding: 14px; border: 1px solid var(--border-color); border-radius: 10px; margin-bottom: 12px; transition: 0.2s; background: #fff; }
    .place-card:hover { border-color: var(--primary-color); background: #FFF9F5; }
    .place-name { font-weight: bold; font-size: 1.05rem; margin-bottom: 4px; cursor: pointer; }
    .place-meta { font-size: 0.82rem; color: #6C757D; margin-bottom: 8px; }
    .badge { font-size: 0.72rem; padding: 2px 6px; background: #FFE8D6; color: #D9480F; border-radius: 4px; display: inline-block; }
    
    #map { flex: 1; height: 100%; width: 100%; }
    
    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 2000; justify-content: center; align-items: center; }
    .modal-content { background: white; padding: 24px; border-radius: 12px; width: 90%; max-width: 400px; display: flex; flex-direction: column; gap: 10px; }
    .modal-content input, .modal-content select, .modal-content textarea { width: 100%; padding: 8px 12px; border: 1px solid #ccc; border-radius: 6px; font-size: 0.9rem; }
    .form-btns { display: flex; gap: 8px; justify-content: flex-end; margin-top: 4px; }
  </style>
</head>
<body>

  <div id="sidebar">
    <div class="header">
      <h1>🐶 PetMap HK 寵物地圖</h1>
      <button class="btn-add" onclick="openModal()">+ 推薦地點</button>
    </div>
    
    <div class="controls">
      <input type="text" id="searchInput" class="search-input" placeholder="搜尋地點或地區..." oninput="filterPlaces()">
      
      <div class="filter-tags">
        <button class="btn-filter active" data-type="all" onclick="setCategoryFilter('all', this)">全部</button>
        <button class="btn-filter" data-type="restaurant" onclick="setCategoryFilter('restaurant', this)">🍽️ 餐廳</button>
        <button class="btn-filter" data-type="park" onclick="setCategoryFilter('park', this)">🌳 公園</button>
        
        <select id="regionSelect" class="region-select" onchange="filterPlaces()">
          <option value="all">📍 全港區域</option>
          <option value="hk">🇭🇰 香港島</option>
          <option value="kln">🏙️ 九龍</option>
          <option value="nt">⛰️ 新界</option>
        </select>
      </div>
    </div>

    <div id="placeList" class="place-list"></div>

    <div style="padding: 12px; text-align: center; font-size: 0.85rem; border-top: 1px solid var(--border-color); color: #6c757d; background: #fff;">
      有任何建議？歡迎追蹤並私訊 <a href="https://www.instagram.com/petmap_hk?stkn=MTV5dGk3aGt4aDdjMw%3D%3D&utm_source=qr" target="_blank" style="color: var(--primary-color); font-weight: bold; text-decoration: none;">@petmap_hk</a>
    </div>
  </div>

  <button id="toggleSidebarBtn" onclick="toggleSidebar()">◀</button>
  <div id="map"></div>

  <!-- 新增地點 Modal -->
  <div id="modal" class="modal">
    <div class="modal-content">
      <h2>新增 / 推薦寵物友善地點</h2>
      <input type="text" id="addName" placeholder="地點名稱 (如: CoCo Espresso)" required>
      <select id="addCategory">
        <option value="restaurant">餐廳</option>
        <option value="park">公園 / 露天設施</option>
      </select>
      <input type="text" id="addDistrict" placeholder="地區 (如: 葵青區 / 中西區)" required>
      
      <!-- 這裡改用 Google Autocomplete 地址輸入框 -->
      <input type="text" id="addAddress" placeholder="輸入詳細地址 (自動帶入座標)" required>
      
      <!-- 經緯度改為唯讀或隱藏，由系統自動填入 -->
      <div style="display: flex; gap: 8px;">
        <input type="number" step="any" id="addLat" placeholder="緯度 Lat" readonly style="background: #f1f3f5;" required>
        <input type="number" step="any" id="addLng" placeholder="經度 Lng" readonly style="background: #f1f3f5;" required>
      </div>

      <textarea id="addComment" placeholder="推薦理由或備註..."></textarea>
      
      <div class="form-btns">
        <button onclick="closeModal()" style="padding: 6px 12px; background: #ccc; border:none; border-radius:6px; cursor:pointer;">取消</button>
        <button onclick="submitPlace()" style="padding: 6px 12px; background: var(--primary-color); color:white; border:none; border-radius:6px; cursor:pointer;">提交審核</button>
      </div>
    </div>
  </div>

  <!-- 評論與評分 Modal -->
  <div id="reviewModal" class="modal">
    <div class="modal-content" style="max-height: 85vh; overflow-y: auto;">
      <h3 id="reviewModalTitle">餐廳評論</h3>
      
      <div id="reviewsListContainer" style="margin-bottom: 12px; max-height: 200px; overflow-y: auto; border-bottom: 1px solid #eee; padding-bottom: 8px;"></div>

      <h4>留下你的真實體驗</h4>
      <input type="text" id="reviewNickname" placeholder="你的暱稱 (例如: 豆豆麻)" required>
      <select id="reviewStars">
        <option value="5">⭐⭐⭐⭐⭐ (非常友善！)</option>
        <option value="4">⭐⭐⭐⭐ (不錯，推推)</option>
        <option value="3">⭐⭐⭐ (普通)</option>
        <option value="2">⭐⭐ (麻麻地)</option>
        <option value="1">⭐ (不太推薦)</option>
      </select>
      <textarea id="reviewComment" placeholder="分享一下環境、是否可落地、店員態度等..."></textarea>
      
      <label style="font-size: 0.82rem; color: #666; margin-top: 4px;">📸 上傳現場或寵物相片 (選填)：</label>
      <input type="file" id="reviewImageFile" accept="image/*" style="font-size: 0.8rem; padding: 4px;">
      
      <div class="form-btns">
        <button onclick="closeReviewModal()" style="padding: 6px 12px; background: #ccc; border:none; border-radius:6px; cursor:pointer;">關閉</button>
        <button onclick="submitReview()" style="padding: 6px 12px; background: var(--primary-color); color:white; border:none; border-radius:6px; cursor:pointer;">送出評論</button>
      </div>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const SUPABASE_URL = 'https://jwkuiiqmdvzcziktogyt.supabase.co';
    const SUPABASE_KEY = 'sb_publishable__ymynGSa7V7lM07uijuNkQ_U4nX3yJd';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let map, markersGroup;
    let allPlaces = [];
    let currentCategory = 'all';
    let currentSelectedRestaurant = '';
    let autocomplete;

    function initMap() {
      map = L.map('map').setView([22.3193, 114.1694], 11);
      L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', {
        attribution: 'Tiles &copy; Esri'
      }).addTo(map);

      markersGroup = L.layerGroup().addTo(map);
      loadPlacesFromSupabase();
      initAutocomplete(); // 初始化 Google 地址自動完成

      setTimeout(() => {
        map.invalidateSize();
      }, 300);
    }

    // 初始化 Google Places Autocomplete
    function initAutocomplete() {
      const input = document.getElementById('addAddress');
      const options = {
        componentRestrictions: { country: 'hk' }, // 限制香港地區
        fields: ['geometry', 'formatted_address', 'name'],
        types: ['geocode', 'establishment']
      };

      autocomplete = new google.maps.places.Autocomplete(input, options);

      autocomplete.addListener('place_changed', () => {
        const place = autocomplete.getPlace();

        if (!place.geometry || !place.geometry.location) {
          alert("找不到該地址的經緯度資訊，請嘗試重新選擇。");
          return;
        }

        const lat = place.geometry.location.lat();
        const lng = place.geometry.location.lng();

        // 自動將經緯度填入唯讀欄位
        document.getElementById('addLat').value = lat;
        document.getElementById('addLng').value = lng;
      });
    }

    function toggleSidebar() {
      const sidebar = document.getElementById('sidebar');
      const btn = document.getElementById('toggleSidebarBtn');
      sidebar.classList.toggle('collapsed');
      btn.innerHTML = sidebar.classList.contains('collapsed') ? '▶' : '◀';
      setTimeout(() => { map.invalidateSize(); }, 300);
    }

    async function loadPlacesFromSupabase() {
      const { data, error } = await supabaseClient
        .from('places')
        .select('*')
        .eq('status', 'approved');

      if (error) {
        console.error('Error fetching places:', error);
        return;
      }
      allPlaces = data || [];
      filterPlaces();
    }

    function getRegion(district) {
      if (!district) return '';
      const hk = ['中西區', '灣仔區', '東區', '南區'];
      const kln = ['油尖旺區', '深水埗區', '九龍城區', '黃大仙區', '觀塘區', '尖沙咀', '葵涌'];
      const nt = ['葵青區', '荃灣區', '屯門區', '元朗區', '北區', '大埔區', '沙田區', '西貢區', '離島區'];

      if (hk.some(d => district.includes(d))) return 'hk';
      if (kln.some(d => district.includes(d))) return 'kln';
      if (nt.some(d => district.includes(d))) return 'nt';
      return '';
    }

    function setCategoryFilter(category, btnElement) {
      document.querySelectorAll('.btn-filter').forEach(b => b.classList.remove('active'));
      btnElement.classList.add('active');
      currentCategory = category;
      filterPlaces();
    }

    function filterPlaces() {
      const searchVal = document.getElementById('searchInput').value.toLowerCase();
      const selectedRegion = document.getElementById('regionSelect').value;

      const filtered = allPlaces.filter(place => {
        const matchSearch = (place.name || '').toLowerCase().includes(searchVal) || 
                            (place.district || '').toLowerCase().includes(searchVal) ||
                            (place.address || '').toLowerCase().includes(searchVal);
        const matchCategory = currentCategory === 'all' || place.category === currentCategory;
        const matchRegion = selectedRegion === 'all' || getRegion(place.district) === selectedRegion;

        return matchSearch && matchCategory && matchRegion;
      });

      renderListAndMarkers(filtered);
    }

    function renderListAndMarkers(places) {
      const listEl = document.getElementById('placeList');
      listEl.innerHTML = '';
      markersGroup.clearLayers();

      if (places.length === 0) {
        listEl.innerHTML = '<div style="text-align:center; color:#888; margin-top:20px;">沒有找到符合條件的地點</div>';
        return;
      }

      places.forEach(place => {
        const mapsUrl = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(place.name + ' ' + (place.address || ''))}`;

        const card = document.createElement('div');
        card.className = 'place-card';
        card.innerHTML = `
          <div class="place-name" onclick="map.flyTo([${place.lat}, ${place.lng}], 16);">${place.name}</div>
          <div class="place-meta">📍 ${place.district || '未填寫'} | 地址: <a href="${mapsUrl}" target="_blank" style="color: #3182ce; text-decoration: underline;">${place.address || '未填寫'}</a></div>
          <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 8px;">
            <span class="badge">${place.category === 'restaurant' ? '🍽️ 餐廳' : '🌳 公園'}</span>
            <a href="${mapsUrl}" target="_blank" style="padding: 4px 10px; background: #3182ce; color: white; border-radius: 4px; text-decoration: none; font-size: 12px; font-weight: 600;">🗺️ 導航</a>
          </div>
        `;
        listEl.appendChild(card);

        const iconEmoji = place.category === 'restaurant' ? '🍽️' : '🌲';
        const customIcon = L.divIcon({
          html: `<div style="font-size: 20px; line-height: 20px; text-align: center; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3));">${iconEmoji}</div>`,
          className: 'custom-emoji-marker',
          iconSize: [24, 24],
          iconAnchor: [12, 12]
        });

        const marker = L.marker([place.lat, place.lng], { icon: customIcon })
          .bindPopup(`
            <div style="min-width: 180px;">
              <b style="font-size: 1rem;">${place.name}</b><br>
              <span style="font-size: 0.8rem; color: #666;">${place.address || ''}</span><br>
              <div style="display: flex; gap: 6px; margin-top: 8px;">
                <a href="${mapsUrl}" target="_blank" style="flex: 1; text-align: center; padding: 4px; background: #3182ce; color:white; border-radius:4px; text-decoration:none; font-size: 11px;">導航</a>
                <button onclick="openReviewModal('${place.name.replace(/'/g, "\\'")}')" style="flex: 1; padding: 4px; background: var(--primary-color); color:white; border:none; border-radius:4px; cursor:pointer; font-size: 11px;">評論 💬</button>
              </div>
            </div>
          `);
        markersGroup.addLayer(marker);
      });
    }

    function openModal() { document.getElementById('modal').style.display = 'flex'; }
    function closeModal() { document.getElementById('modal').style.display = 'none'; }

    async function openReviewModal(restaurantName) {
      currentSelectedRestaurant = restaurantName;
      document.getElementById('reviewModalTitle').innerText = `${restaurantName} - 評論區`;
      document.getElementById('reviewModal').style.display = 'flex';
      
      document.getElementById('reviewNickname').value = '';
      document.getElementById('reviewComment').value = '';
      document.getElementById('reviewImageFile').value = '';

      const container = document.getElementById('reviewsListContainer');
      container.innerHTML = '載入中...';

      const { data, error } = await supabaseClient
        .from('reviews')
        .select('*')
        .eq('restaurant_id', restaurantName)
        .order('created_at', { ascending: false });

      if (error || !data || data.length === 0) {
        container.innerHTML = '<div style="color: #888; font-size: 0.85rem; text-align: center; padding: 10px;">暫無評論，快來搶頭香留第一個心得吧！</div>';
        return;
      }

      container.innerHTML = data.map(r => `
        <div style="margin-bottom: 10px; padding-bottom: 8px; border-bottom: 1px dashed #f1f3f5; font-size: 0.85rem;">
          <b>${r.nickname}</b> <span style="color: #f59e0b;">${'⭐'.repeat(r.rating_stars)}</span>
          <p style="margin: 2px 0; color: #444;">${r.comment_text}</p>
          ${r.image_url ? `<div style="margin-top: 6px;"><img src="${r.image_url}" style="max-width: 100%; max-height: 120px; border-radius: 6px; object-fit: cover;"></div>` : ''}
          <span style="font-size: 0.75rem; color: #999;">${new Date(r.created_at).toLocaleDateString()}</span>
        </div>
      `).join('');
    }

    function closeReviewModal() {
      document.getElementById('reviewModal').style.display = 'none';
    }

    async function submitReview() {
      const nickname = document.getElementById('reviewNickname').value.trim();
      const rating_stars = parseInt(document.getElementById('reviewStars').value);
      const comment_text = document.getElementById('reviewComment').value.trim();
      const fileInput = document.getElementById('reviewImageFile');

      if (!nickname || !comment_text) {
        alert('請填寫暱稱與評論內容！');
        return;
      }

      let imageUrl = null;

      if (fileInput.files.length > 0) {
        const file = fileInput.files[0];
        const fileExt = file.name.split('.').pop();
        const fileName = `${Date.now()}_${Math.random().toString(36).substring(2)}.${fileExt}`;
        
        const { error: uploadError } = await supabaseClient.storage
          .from('reviews-images')
          .upload(fileName, file);

        if (uploadError) {
          alert('相片上傳失敗：' + uploadError.message);
          return;
        }

        const { data: publicUrlData } = supabaseClient.storage
          .from('reviews-images')
          .getPublicUrl(fileName);

        imageUrl = publicUrlData.publicUrl;
      }

      const { error } = await supabaseClient.from('reviews').insert([{
        restaurant_id: currentSelectedRestaurant,
        nickname,
        rating_stars,
        comment_text,
        image_url: imageUrl
      }]);

      if (error) {
        alert('提交失敗：' + error.message);
      } else {
        alert('感謝你的分享！評論已成功送出。');
        openReviewModal(currentSelectedRestaurant); 
      }
    }

    async function submitPlace() {
      const name = document.getElementById('addName').value;
      const category = document.getElementById('addCategory').value;
      const district = document.getElementById('addDistrict').value;
      const address = document.getElementById('addAddress').value;
      const lat = parseFloat(document.getElementById('addLat').value);
      const lng = parseFloat(document.getElementById('addLng').value);
      const user_comment = document.getElementById('addComment').value;

      if (!name || isNaN(lat) || isNaN(lng)) {
        alert('請確實輸入地點名稱，並透過下拉選單點選有效的地址以自動帶入經緯度！');
        return;
      }

      const { error } = await supabaseClient.from('places').insert([{
        name, category, district, address, lat, lng, user_comment, status: 'pending'
      }]);

      if (error) {
        alert('提交失敗：' + error.message);
      } else {
        alert('提交成功！等待管理員審核後即可在地圖上顯示。');
        closeModal();
      }
    }

    window.onload = initMap;
  </script>
</body>
</html>
