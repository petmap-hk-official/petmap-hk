<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <!-- Google Tag Manager -->
  <script>(function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':
  new Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],
  j=d.createElement(s),async=true,src='https://www.googletagmanager.com/gtm.js?id='+i+f.async;j.src.parentNode.insertBefore(j,f);
  })(window,document,'script','layer','GTM-W3LVQP38');</script>
  <!-- End Google Tag Manager -->

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PetMap HK - 香港寵物友善地圖</title>
  
  <!-- 💡 App 主畫面圖標設定 -->
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="manifest" href="manifest.json">

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root { --primary-color: #FF7A00; --bg-light: #F8F9FA; --border-color: #E9ECEF; --text-dark: #212529; }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
    body { display: flex; height: 100vh; color: var(--text-dark); overflow: hidden; position: relative; }
    
    /* 側邊欄與收起動畫（強制鎖定電腦版左右並排架構） */
    #sidebar { 
      width: 380px; 
      height: 100vh; 
      background: white; 
      border-right: 1px solid var(--border-color); 
      display: flex; 
      flex-direction: column; 
      z-index: 1000; 
      box-shadow: 2px 0 10px rgba(0,0,0,0.05); 
      position: absolute;
      top: 0;
      left: 0;
      transition: transform 0.3s ease-in-out;
      transform: translateX(0); 
    }

    /* 當側邊欄被收起時，向左平移整個寬度 */
    #sidebar.collapsed {
      transform: translateX(-380px);
    }

    /* 淺灰色小三角形按鈕 */
    #toggleSidebarBtn {
      position: fixed;
      left: 380px;
      top: 50%;
      transform: translateY(-50%);
      width: 28px;
      height: 60px;
      background-color: #e2e8f0;
      border: 1px solid #cbd5e0;
      border-left: none;
      border-radius: 0 8px 8px 0;
      color: #4a5568;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 2px 0 5px rgba(0,0,0,0.08);
      z-index: 1001;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: left 0.3s ease-in-out, background-color 0.2s;
    }

    #toggleSidebarBtn:hover {
      background-color: #cbd5e0;
    }

    /* 當側邊欄收起時，按鈕要跟著移動到畫面的最左邊（left: 0） */
    #sidebar.collapsed ~ #toggleSidebarBtn {
      left: 0;
    }

    .header { padding: 16px; background: var(--primary-color); color: white; display: flex; justify-content: space-between; align-items: center; }
    .header h1 { font-size: 1.1rem; }
    .btn-add { background: white; color: var(--primary-color); border: none; padding: 6px 12px; border-radius: 20px; font-weight: bold; cursor: pointer; }
    .controls { padding: 16px; border-bottom: 1px solid var(--border-color); display: flex; flex-direction: column; gap: 10px; }
    .search-input { width: 100%; padding: 10px 14px; border: 1px solid #CED4DA; border-radius: 8px; outline: none; }
    .filter-tags { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    .btn-filter { padding: 6px 12px; border: 1px solid var(--border-color); border-radius: 20px; background: var(--bg-light); cursor: pointer; font-size: 0.85rem; }
    .btn-filter.active { background: var(--primary-color); color: white; border-color: var(--primary-color); }
    .region-select { padding: 6px 10px; border: 1px solid #CED4DA; border-radius: 20px; background: white; font-size: 0.85rem; outline: none; cursor: pointer; }
    .place-list { flex: 1; overflow-y: auto; padding: 12px; min-height: 0; }
    .place-card { padding: 14px; border: 1px solid var(--border-color); border-radius: 10px; margin-bottom: 12px; transition: 0.2s; background: #fff; }
    .place-card:hover { border-color: var(--primary-color); background: #FFF9F5; }
    .place-name { font-weight: bold; font-size: 1.05rem; margin-bottom: 4px; cursor: pointer; }
    .place-meta { font-size: 0.82rem; color: #6C757D; margin-bottom: 8px; }
    .badge { font-size: 0.72rem; padding: 2px 6px; background: #FFE8D6; color: #D9480F; border-radius: 4px; display: inline-block; }
    
    /* 讓地圖佔滿整個背景，手機也會在側邊欄下方展開 */
    #map { flex: 1; height: 100%; width: 100%; }
    
    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 2000; justify-content: center; align-items: center; }
    .modal-content { background: white; padding: 24px; border-radius: 12px; width: 90%; max-width: 400px; display: flex; flex-direction: column; gap: 12px; }
    .modal-content input, .modal-content select, .modal-content textarea { width: 100%; padding: 8px 12px; border: 1px solid #ccc; border-radius: 6px; }
    .form-btns { display: flex; gap: 8px; justify-content: flex-end; }
  </style>
</head>
<body>

  <!-- Google Tag Manager (noscript) -->
  <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-W3LVQP38"
  height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
  <!-- End Google Tag Manager (noscript) -->

  <!-- 側邊欄容器 -->
  <div id="sidebar">
    <div class="header">
      <h1>🐶 PetMap HK 寵物地圖</h1>
      <button class="btn-add" onclick="openModal()">+ 推薦地點</button>
    </div>
    
    <div class="controls">
      <input type="text" id="searchInput" class="search-input" placeholder="搜尋地點或地區..." oninput="filterPlaces()">
      
      <div class="filter-tags">
        <button class="btn-filter active" data-type="all" onclick="setCategoryFilter('all', this)">全部</button>
        <button class="btn-filter" data-type="restaurant" onclick="setCategoryFilter('restaurant', this)">🍽️ 餐廳</button>
        <button class="btn-filter" data-type="park" onclick="setCategoryFilter('park', this)">🌳 公園</button>
        
        <select id="regionSelect" class="region-select" onchange="filterPlaces()">
          <option value="all">📍 全港區域</option>
          <option value="hk">🇭🇰 香港島</option>
          <option value="kln">🏙️ 九龍</option>
          <option value="nt">⛰️ 新界</option>
        </select>
      </div>
    </div>

    <!-- 地點清單 -->
    <div id="placeList" class="place-list"></div>

    <!-- 側邊欄底部：只保留簡潔的文字提示與 IG 連結 -->
    <div style="padding: 12px; text-align: center; font-size: 0.85rem; border-top: 1px solid var(--border-color); color: #6c757d; background: #fff;">
      有任何建議？歡迎追蹤並私訊 <a href="https://www.instagram.com/petmap_hk?stkn=MTV5dGk3aGt4aDdjMw%3D%3D&utm_source=qr" target="_blank" style="color: var(--primary-color); font-weight: bold; text-decoration: none;">@petmap_hk</a>
    </div>
  </div>

  <!-- 獨立的收起/展開按鈕 -->
  <button id="toggleSidebarBtn" onclick="toggleSidebar()">◀</button>

  <div id="map"></div>

  <!-- 新增地點 Modal -->
  <div id="modal" class="modal">
    <div class="modal-content">
      <h2>新增 / 推薦寵物友善地點</h2>
      <input type="text" id="addName" placeholder="地點名稱 (如: CoCo Espresso)" required>
      <select id="addCategory">
        <option value="restaurant">餐廳</option>
        <option value="park">公園 / 露天設施</option>
      </select>
      <input type="text" id="addDistrict" placeholder="地區 (如: 葵青區 / 中西區)" required>
      <input type="text" id="addAddress" placeholder="詳細地址">
      <input type="number" step="any" id="addLat" placeholder="緯度 Lat (如: 22.3642)" required>
      <input type="number" step="any" id="addLng" placeholder="經度 Lng (如: 114.1331)" required>
      <textarea id="addComment" placeholder="推薦理由或備註..."></textarea>
      
      <div class="form-btns">
        <button onclick="closeModal()" style="padding: 6px 12px; background: #ccc; border:none; border-radius:6px; cursor:pointer;">取消</button>
        <button onclick="submitPlace()" style="padding: 6px 12px; background: var(--primary-color); color:white; border:none; border-radius:6px; cursor:pointer;">提交審核</button>
      </div>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const SUPABASE_URL = 'https://jwkuiiqmdvzcziktogyt.supabase.co';
    const SUPABASE_KEY = 'sb_publishable__ymynGSa7V7lM07uijuNkQ_U4nX3yJd';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let map, markersGroup;
    let allPlaces = [];
    let currentCategory = 'all';

    // 初始化地圖
    function initMap() {
      map = L.map('map').setView([22.3193, 114.1694], 11);
      L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', {
        attribution: 'Tiles &copy; Esri'
      }).addTo(map);

      markersGroup = L.layerGroup().addTo(map);
      loadPlacesFromSupabase();
    }

    // 側邊欄收起/展開切換函數
    function toggleSidebar() {
      const sidebar = document.getElementById('sidebar');
      const btn = document.getElementById('toggleSidebarBtn');
      sidebar.classList.toggle('collapsed');
      
      if (sidebar.classList.contains('collapsed')) {
        btn.innerHTML = '▶';
      } else {
        btn.innerHTML = '◀';
      }
    }

    // 從 Supabase 讀取 approved 資料
    async function loadPlacesFromSupabase() {
      const { data, error } = await supabaseClient
        .from('places')
        .select('*')
        .eq('status', 'approved');

      if (error) {
        console.error('Error fetching places:', error);
        return;
      }

      allPlaces = data || [];
      filterPlaces();
    }

    // 地區對應判斷 (18區歸類為 港島/九龍/新界)
    function getRegion(district) {
      if (!district) return '';
      const hk = ['中西區', '灣仔區', '東區', '南區'];
      const kln = ['油尖旺區', '深水埗區', '九龍城區', '黃大仙區', '觀塘區', '尖沙咀', '葵涌'];
      const nt = ['葵青區', '荃灣區', '屯門區', '元朗區', '北區', '大埔區', '沙田區', '西貢區', '離島區'];

      if (hk.some(d => district.includes(d))) return 'hk';
      if (kln.some(d => district.includes(d))) return 'kln';
      if (nt.some(d => district.includes(d))) return 'nt';
      return '';
    }

    // 類別按鈕切換
    function setCategoryFilter(category, btnElement) {
      document.querySelectorAll('.btn-filter').forEach(b => b.classList.remove('active'));
      btnElement.classList.add('active');
      currentCategory = category;
      filterPlaces();
    }

    // 綜合篩選（搜尋 + 類別 + 地區）
    function filterPlaces() {
      const searchVal = document.getElementById('searchInput').value.toLowerCase();
      const selectedRegion = document.getElementById('regionSelect').value;

      const filtered = allPlaces.filter(place => {
        const matchSearch = (place.name || '').toLowerCase().includes(searchVal) || 
                            (place.district || '').toLowerCase().includes(searchVal) ||
                            (place.address || '').toLowerCase().includes(searchVal);
        const matchCategory = currentCategory === 'all' || place.category === currentCategory;
        const matchRegion = selectedRegion === 'all' || getRegion(place.district) === selectedRegion;

        return matchSearch && matchCategory && matchRegion;
      });

      renderListAndMarkers(filtered);
    }

    // 渲染清單與地圖標記
    function renderListAndMarkers(places) {
      const listEl = document.getElementById('placeList');
      listEl.innerHTML = '';
      markersGroup.clearLayers();

      if (places.length === 0) {
        listEl.innerHTML = '<div style="text-align:center; color:#888; margin-top:20px;">沒有找到符合條件的地點</div>';
        return;
      }

      places.forEach(place => {
        const mapsUrl = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(place.name + ' ' + (place.address || ''))}`;

        const card = document.createElement('div');
        card.className = 'place-card';
        card.innerHTML = `
          <div class="place-name" onclick="map.flyTo([${place.lat}, ${place.lng}], 16);">${place.name}</div>
          <div class="place-meta">📍 ${place.district || '未填寫'} | 地址: <a href="${mapsUrl}" target="_blank" style="color: #3182ce; text-decoration: underline;">${place.address || '未填寫'}</a></div>
          <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 8px;">
            <span class="badge">${place.category === 'restaurant' ? '🍽️ 餐廳' : '🌳 公園'}</span>
            <a href="${mapsUrl}" target="_blank" style="padding: 4px 10px; background: #3182ce; color: white; border-radius: 4px; text-decoration: none; font-size: 12px; font-weight: 600;">🗺️ 導航</a>
          </div>
        `;
        listEl.appendChild(card);

        // 💡 根據分類設定對應的 Emoji 圖示
        const iconEmoji = place.category === 'restaurant' ? '🍽️' : '🌲';
        const customIcon = L.divIcon({
          html: `<div style="font-size: 20px; line-height: 20px; text-align: center; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3));">${iconEmoji}</div>`,
          className: 'custom-emoji-marker',
          iconSize: [24, 24],
          iconAnchor: [12, 12]
        });

        const marker = L.marker([place.lat, place.lng], { icon: customIcon })
          .bindPopup(`<b>${place.name}</b><br>${place.address || ''}<br><a href="${mapsUrl}" target="_blank" style="color:#3182ce; font-weight:bold; display:inline-block; margin-top:4px;">在 Google 地圖中開啟</a>`);
        markersGroup.addLayer(marker);
      });
    }

    // Modal 控制
    function openModal() { document.getElementById('modal').style.display = 'flex'; }
    function closeModal() { document.getElementById('modal').style.display = 'none'; }

    // 提交新地點至 Supabase
    async function submitPlace() {
      const name = document.getElementById('addName').value;
      const category = document.getElementById('addCategory').value;
      const district = document.getElementById('addDistrict').value;
      const address = document.getElementById('addAddress').value;
      const lat = parseFloat(document.getElementById('addLat').value);
      const lng = parseFloat(document.getElementById('addLng').value);
      const user_comment = document.getElementById('addComment').value;

      if (!name || !lat || !lng) {
        alert('請填寫完整的地點名稱與經緯度！');
        return;
      }

      const { error } = await supabaseClient.from('places').insert([{
        name, category, district, address, lat, lng, user_comment, status: 'pending'
      }]);

      if (error) {
        alert('提交失敗：' + error.message);
      } else {
        alert('提交成功！等待管理員審核後即可在地圖上顯示。');
        closeModal();
      }
    }

    window.onload = initMap;
  </script>
</body>
</html>
